name: Oracle ARM Sniper

on:
  schedule:
    # Every 3h. Actions minutes are free and unmetered on this public repo, so
    # cadence costs nothing; coverage is the only thing that matters, because
    # the local sniper only runs while the PC is awake.
    #
    # Was every 6h, which on paper gave 4 x 5h40m = 22.7h/day. Measured against
    # the actual run history for 2026-08-25..09-02 it delivered 18.2h/day:
    # 49.6h dark across 19 holes, the worst 8.0h long. Two causes compound.
    # A 6h cron against a 5h40m run leaves 20 min uncovered by design, and
    # GitHub defers scheduled runs on public repos under load - the deferral
    # here grew from +0.5h in late August to +4.9h on the 2026-09-02 run. Once
    # the deferral approaches the 5h40m runtime, the next run starts only after
    # the previous one has already died, which is where the multi-hour holes
    # came from.
    #
    # At 3h the schedule tolerates a deferral of nearly 5h40m before a hole can
    # open at all, so the runs overlap instead of leaving gaps. Overlap is the
    # point, not a side effect: A1 capacity windows last seconds, so two
    # snipers probing is strictly better than none. The cost is that concurrent
    # snipers share one tenancy's API budget and push each other into HTTP 429
    # more often (13% of attempts were rate limited at the old cadence); the
    # per-process backoff in Sniper.py absorbs that.
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required to check out this private repo
      actions: write   # lets the sniper disable this workflow after a successful launch
      issues: write    # lets the run open a notification issue when it wins
    timeout-minutes: 350  # ~5h 50m (GitHub max is 6h)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: pip install oci

      - name: Write OCI config file
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << 'OCIEOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-mumbai-1
          key_file=~/.oci/oci_api_key.pem
          OCIEOF
          # Remove leading spaces from heredoc
          sed -i 's/^          //' ~/.oci/config

      - name: Write OCI API private key
        run: |
          echo "${{ secrets.OCI_API_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Sniper (loops for ~5 hours)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AD_NAME: ${{ secrets.OCI_AD_NAME }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUB_KEY: ${{ secrets.OCI_SSH_PUB_KEY }}
        run: |
          timeout 20400 python Sniper.py || true
        # timeout = 5h 40m in seconds (340 * 60)
        # `|| true` so the workflow doesn't fail when timeout kills it

      # Sniper.py writes instance_success.txt only after a real launch, so its
      # presence is the win signal. An assigned issue is the cheapest reliable
      # push: assignment always notifies, regardless of watch settings.
      - name: Notify on successful launch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f instance_success.txt ]; then
            echo "No instance_success.txt - still hunting, no notification sent"
            exit 0
          fi
          echo "Instance acquired - opening notification issue"
          {
            echo "The sniper launched an instance."
            echo
            cat instance_success.txt
            echo
            echo "Workflow run: $RUN_URL"
          } > issue_body.md
          gh issue create --title "Oracle A1 instance acquired" --assignee "$OWNER" --body-file issue_body.md

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniper-log-${{ github.run_id }}
          path: sniper.log
          retention-days: 3
