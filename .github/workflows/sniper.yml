name: Oracle ARM Sniper

on:
  schedule:
    # Every 6h. The old 2000-minute cap that forced this down to daily no
    # longer applies: the repo is public now, so Actions minutes are free and
    # unmetered. 4 runs x 5h40m gives ~22.7h/day of cloud cover, which matters
    # because the local sniper only runs while the PC is awake.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required to check out this private repo
      actions: write   # lets the sniper disable this workflow after a successful launch
      issues: write    # lets the run open a notification issue when it wins
    timeout-minutes: 350  # ~5h 50m (GitHub max is 6h)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: pip install oci

      - name: Write OCI config file
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config << 'OCIEOF'
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-mumbai-1
          key_file=~/.oci/oci_api_key.pem
          OCIEOF
          # Remove leading spaces from heredoc
          sed -i 's/^          //' ~/.oci/config

      - name: Write OCI API private key
        run: |
          echo "${{ secrets.OCI_API_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Sniper (loops for ~5 hours)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_AD_NAME: ${{ secrets.OCI_AD_NAME }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUB_KEY: ${{ secrets.OCI_SSH_PUB_KEY }}
        run: |
          timeout 20400 python Sniper.py || true
        # timeout = 5h 40m in seconds (340 * 60)
        # `|| true` so the workflow doesn't fail when timeout kills it

      # Sniper.py writes instance_success.txt only after a real launch, so its
      # presence is the win signal. An assigned issue is the cheapest reliable
      # push: assignment always notifies, regardless of watch settings.
      - name: Notify on successful launch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f instance_success.txt ]; then
            echo "No instance_success.txt - still hunting, no notification sent"
            exit 0
          fi
          echo "Instance acquired - opening notification issue"
          {
            echo "The sniper launched an instance."
            echo
            cat instance_success.txt
            echo
            echo "Workflow run: $RUN_URL"
          } > issue_body.md
          gh issue create --title "Oracle A1 instance acquired" --assignee "$OWNER" --body-file issue_body.md

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniper-log-${{ github.run_id }}
          path: sniper.log
          retention-days: 3
